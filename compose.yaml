name: counter-compose

services:
  app:
    build: .
    ports:
      - "127.0.0.1:${HOST_PORT}:${APP_PORT}"
    environment:
      PORT: ${APP_PORT}
      GREETING: ${GREETING}
      STORAGE: sqlite
      DATA_FILE: /data/counter.db
    volumes:
      - counter-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 3s

volumes:
  counter-data:
